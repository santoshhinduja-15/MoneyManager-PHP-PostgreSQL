
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MoneyManager</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Auth CSS -->
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="auth-page">

        <div class="theme-toggle">
            <button
                type="button"
                id="themeToggle"
                class="btn theme-btn"
                aria-label="Toggle theme"
            >
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
        </div>


        <div class="auth-container">

            <!-- Logo -->
            <div class="auth-logo">

                <a href="../index.html">

                    <img
                        src="images/logo-light.jpg"
                        id="brandLogo"
                        alt="MoneyManager Logo"
                    >

                </a>

            </div>


            <!-- Heading -->
            <div class="auth-heading">

                <h2>Welcome Back!</h2>

                <p>Login to manage your money.</p>

            </div>


            <!-- General Alert -->
            <div
                id="alertMessage"
                class="alert d-none"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Username -->
                <div class="mb-3">

                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        minlength="3"
                        maxlength="30"
                        autocomplete="username"
                        required
                    >

                    <div
                        class="field-error"
                        id="usernameError"
                    ></div>

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            maxlength="64"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <div
                        class="field-error"
                        id="passwordError"
                    ></div>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    id="loginButton"
                    class="btn auth-submit-btn w-100"
                    disabled
                >

                    <span id="loginButtonText">
                        Login
                    </span>

                    <span
                        id="loginSpinner"
                        class="spinner-border spinner-border-sm d-none"
                        aria-hidden="true"
                    ></span>

                </button>

            </form>


            <!-- Signup Link -->
            <div class="auth-footer">

                <p>
                    Don't have an account?

                    <a href="signup.html">
                        Sign Up
                    </a>
                </p>

                <a href="../index.html" class="back-home-link">
                    <i class="bi bi-arrow-left"></i>
                    Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Login JS -->
    <script src="js/login.js"></script>

</body>

</html>
